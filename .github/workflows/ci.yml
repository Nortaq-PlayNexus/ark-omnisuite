name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install bot deps
        run: python -m pip install -r bot/requirements.txt
      - name: Core tests
        run: python -m unittest discover -s core/tests -v
      - name: HTTP/bot tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Bot dry-run
        run: python -m bot.main --dry-run
