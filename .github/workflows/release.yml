name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package source
        run: zip -r ark-omnisuite-${{ github.ref_name }}-source.zip . -x '*.git*' '*__pycache__*' '*.pyc'
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ark-omnisuite-*-source.zip
